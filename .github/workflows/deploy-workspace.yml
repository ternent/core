name: Deploy Workspace Package

on:
  push:
    tags:
      - "@ternent/workspace-*.*.*"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish @ternent/workspace
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build @ternent/workspace
        run: pnpm --filter @ternent/identity --filter @ternent/armour --filter @ternent/workspace build

      - name: Publish @ternent/workspace
        run: pnpm --filter @ternent/workspace publish --no-git-checks --access public --provenance

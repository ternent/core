name: Concord checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: core-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CI: "true"
      VERIFY_COMPATIBILITY: "true"
      NPM_CONFIG_USERCONFIG: /dev/null
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.18.0
      - name: Record Node 22 consumer runtime
        run: echo "CONCORD_NODE22=$(command -v node)" >> "$GITHUB_ENV"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.21.0
      - name: Record Node 24 consumer runtime
        run: echo "CONCORD_NODE24=$(command -v node)" >> "$GITHUB_ENV"
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install the locked workspace
        run: pnpm install --frozen-lockfile
      - name: Install the independent age reference
        run: |
          curl --fail --silent --show-error --location https://github.com/FiloSottile/age/releases/download/v1.3.1/age-v1.3.1-linux-amd64.tar.gz --output "$RUNNER_TEMP/age.tar.gz"
          printf '%s  %s\n' bdc69c09cbdd6cf8b1f333d372a1f58247b3a33146406333e30c0f26e8f51377 "$RUNNER_TEMP/age.tar.gz" | sha256sum --check -
          tar -xzf "$RUNNER_TEMP/age.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/age" >> "$GITHUB_PATH"
      - name: Install the pinned browser
        run: pnpm exec playwright install --with-deps chromium
      - name: Verify libraries and installed consumers
        run: pnpm check
      - name: Freeze the accepted release candidate bundle
        run: node scripts/release/cli.mjs verification-plan
      - name: Create a disposable proof-test identity
        id: seal-test-key
        run: node scripts/release/cli.mjs test-identity
      - name: Exercise the pinned Seal Action on the release bundle
        uses: samternent/seal-action@d07a683a9195a1190c3e15b6e4374a1d59592b57
        with:
          assets-directory: artifacts/release
          manifest-name: release-manifest.json
          proof-name: release-proof.json
          public-key-name: release-public-key.json
          cli-command: '"${{ steps.seal-test-key.outputs.node }}" "${{ github.workspace }}/packages/seal/bin/seal"'
        env:
          SEAL_IDENTITY_FILE: ${{ steps.seal-test-key.outputs.identity-file }}
      - name: Verify the Action proof and every bundled file
        run: node scripts/release/cli.mjs verify-seal
        env:
          SEAL_RELEASE_PUBLIC_KEY: ${{ steps.seal-test-key.outputs.public-key }}
      - name: Retain acceptance evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: core-evidence
          if-no-files-found: warn
          retention-days: 7
          path: |
            artifacts/check.json
            artifacts/consumers.json
            artifacts/candidate-registry.log
            artifacts/registry-*.log
            artifacts/browser.png
            artifacts/candidates-*/*.tgz
            artifacts/release/
            artifacts/release-receipt.json
